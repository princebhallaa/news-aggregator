<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NewsPulse | India-First Keyword News Aggregator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'system-ui', '-apple-system', 'sans-serif'],
          },
          colors: {
            brand: {
              bg: '#07090e',
              surface: '#0f121a',
              surfaceHover: '#151a26',

              cardBorder: '#1c2233',
              cardBorderHover: '#2d364f',
              text: '#f1f5f9',
              muted: '#7e8a9d',
            },
            saffron: {
              DEFAULT: '#ff9933',
              glow: 'rgba(255, 153, 51, 0.25)',
            },
            green: {
              india: '#138808',
            },
            yt: '#ff0000',
            tg: '#229ed9',
          }
        }
      }
    }

  <link rel="stylesheet" href="style.css">

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>

<body class="bg-brand-bg text-brand-text min-h-screen antialiased selection:bg-saffron/30 selection:text-white">
